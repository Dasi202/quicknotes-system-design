<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="styles.css">
  <script src="api.js" defer></script>
</head>
<body>
  <main>
    <h1>QuickNotes</h1>

    <section aria-labelledby="new-heading">
      <h2 id="new-heading">New note</h2>
      <form id="note-form" novalidate>
        <label for="title-input">Title (required, max 100 characters)</label>
        <input id="title-input" type="text" autocomplete="off">
        <label for="body-input">Body (optional)</label>
        <textarea id="body-input" rows="4"></textarea>
        <button id="submit-btn" type="submit">Save note</button>
      </form>
    </section>

    <section aria-labelledby="list-heading">
      <h2 id="list-heading">Your notes</h2>
      <button id="load-btn" type="button">Load notes</button>
      <p id="status" role="status" aria-live="polite"></p>
      <ul id="notes-list"></ul>
    </section>
  </main>
</body>
</html>
